name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest httpx fastapi uvicorn
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm test && npm run build
  deploy:
    # Practice server only. Needs the DEPLOY_* secrets (see deploy/setup_autodeploy.sh); until they exist this step just says so.
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Deploy to the practice server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::Auto-deploy is not set up yet (missing DEPLOY_* secrets)"; exit 0
          fi
          HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]'); USER_=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          # pin the server's key: take its type and key from the secret, whatever spaces or host text were pasted around it
          KT=$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | tr -s '[:space:]' '\n' | grep -m1 '^ssh-' ); KV=$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | tr -s '[:space:]' '\n' | grep -A1 -m1 '^ssh-' | tail -1)
          if [ -z "$KT" ] || [ -z "$KV" ] || [ "$KT" = "$KV" ]; then echo "::error::DEPLOY_KNOWN_HOSTS does not look like an ssh host key line"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          printf '%s %s %s\n' "$HOST" "$KT" "$KV" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER_@$HOST" deploy
