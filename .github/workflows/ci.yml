name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest httpx fastapi uvicorn
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm test && npm run build
  deploy:
    # Practice server only. Needs the DEPLOY_* secrets (see deploy/setup_autodeploy.sh); until they exist this step just says so.
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Deploy to the practice server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::Auto-deploy is not set up yet (missing DEPLOY_* secrets)"; exit 0
          fi
          HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]'); USER_=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          # The server's public host key is pinned here (it is not a secret). Fingerprint SHA256:zGThneaBL821Fh4ALeaRIXPHnyCGIYpiID+lViJRg+A
          KT="ssh-ed25519"; KV="AAAAC3NzaC1lZDI1NTE5AAAAIPfCas/6ZI41nBgBx+rAHi5tKvyHEF0WwAPZQgc65t9P"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          printf '%s %s %s\n' "$HOST" "$KT" "$KV" > ~/.ssh/known_hosts
          if ! ssh -v -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER_}@${HOST}" deploy 2> ssh.log; then
            echo "::group::Why the connection failed"
            echo "host key you saved (fingerprint):"; ssh-keygen -l -f ~/.ssh/known_hosts 2>&1 || true
            echo "host key the server presents (fingerprint):"; ssh-keyscan -T 10 -t ed25519 "$HOST" 2>/dev/null | ssh-keygen -l -f - 2>&1 || echo "(could not reach the server on port 22)"
            echo "key GitHub holds (fingerprint; compare with the server):"; ssh-keygen -l -f ~/.ssh/deploy_key 2>&1 || echo "(this does not parse as a private key: re-copy DEPLOY_KEY including the BEGIN and END lines)"
            echo "key lines in the secret: $(wc -l < ~/.ssh/deploy_key), first: $(head -1 ~/.ssh/deploy_key | cut -c1-35), last: $(tail -1 ~/.ssh/deploy_key | cut -c1-35)"
            echo "host value length: ${#HOST}, user: ${USER_}, saved key part length: ${#KV}"
            grep -iE "Connecting to|Connection (timed|refused|closed)|Permission denied|Offering public key|Authenticat|no hostkey|Server host key|known_hosts" ssh.log | head -20
            echo "::endgroup::"; exit 1
          fi
